name: Validate

on:
  pull_request:
  push:
    branches: [main, claude/xcode-apps-ui-retention-ep2v4v]
  workflow_dispatch:

# A new push supersedes the one before it; no reason to keep paying for both.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 Scripts/validate_project.py
      - run: python3 -m unittest discover -s Tests/python

  iphone-build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iPhone app and extensions
        run: >-
          xcodebuild -project NoiseGate.xcodeproj -scheme NoiseGate
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Run iPhone model tests
        run: |
          simulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          simulator_id=$(xcrun simctl list devices available --json | python3 Scripts/select_simulator.py --sdk-version "$simulator_sdk")
          xcodebuild -project NoiseGate.xcodeproj -scheme NoiseGate \
          -sdk iphonesimulator \
          -destination "platform=iOS Simulator,id=$simulator_id" \
          CODE_SIGNING_ALLOWED=NO test
  mac-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build Mac app and widget
        run: >-
          xcodebuild -project NoiseGate.xcodeproj -scheme NoiseGateMac
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run model tests
        run: >-
          xcodebuild -project NoiseGate.xcodeproj -scheme NoiseGateMac
          -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
