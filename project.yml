# XcodeGen spec — run `xcodegen generate` in this folder to produce NoiseGate.xcodeproj
# Requires: https://github.com/yonaskolb/XcodeGen  (brew install xcodegen)
#
# BEFORE BUILDING:
#   1. Set DEVELOPMENT_TEAM below to your Apple Team ID.
#   2. Change the bundleIdPrefix (and the app-group id in Shared/AppGroup.swift +
#      the entitlements below) from com.example.noisegate to your own identifier.
#   3. In your Apple Developer account, enable the Family Controls capability for
#      the iOS app + monitor/report extension identifiers.

name: NoiseGate
options:
  bundleIdPrefix: com.example.noisegate
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "YOURTEAMID"
    CODE_SIGN_STYLE: Automatic

targets:

  # ────────────────────────────── iOS app ──────────────────────────────
  NoiseGate:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/ScreenTimeShared
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate
        INFOPLIST_KEY_CFBundleDisplayName: NoiseGate
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    info:
      path: iOS/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/NoiseGate.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.noisegate
    dependencies:
      - target: NoiseGateMonitor
      - target: NoiseGateReport
      - target: NoiseGateWidget

  # DeviceActivityMonitor extension: fires at budget thresholds, posts gentle
  # nudge notifications, updates the widget snapshot. Never blocks anything.
  NoiseGateMonitor:
    type: app-extension
    platform: iOS
    sources:
      - iOS/MonitorExtension
      - iOS/ScreenTimeShared
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate.monitor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: iOS/MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: NoiseGate Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NoiseGateMonitor
    entitlements:
      path: iOS/MonitorExtension/NoiseGateMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.noisegate

  # DeviceActivityReport extension: renders exact on-screen time for the
  # Noise and Messages selections inside the app (privacy-preserving).
  NoiseGateReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - iOS/ReportExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate.report
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: iOS/ReportExtension/Info.plist
      properties:
        CFBundleDisplayName: NoiseGate Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: iOS/ReportExtension/NoiseGateReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.noisegate

  # Home-screen / lock-screen widget.
  NoiseGateWidget:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: NoiseGate Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget/NoiseGateWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.noisegate

  # ────────────────────────────── macOS app ──────────────────────────────
  NoiseGateMac:
    type: application
    platform: macOS
    sources:
      - macOS/App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate.mac
        INFOPLIST_KEY_CFBundleDisplayName: NoiseGate
        ENABLE_HARDENED_RUNTIME: true
    info:
      path: macOS/App/Info.plist
      properties:
        LSUIElement: true   # menu-bar app, no Dock icon
        CFBundleDisplayName: NoiseGate
    entitlements:
      path: macOS/App/NoiseGateMac.entitlements
      properties:
        # Sandboxed: with enforcement gone, the app only observes the
        # frontmost app and posts notifications — nothing needs to escape.
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.example.noisegate
    dependencies:
      - target: NoiseGateMacWidget

  NoiseGateMacWidget:
    type: app-extension
    platform: macOS
    sources:
      - macOS/Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.noisegate.mac.widget
    info:
      path: macOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: NoiseGate Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: macOS/Widget/NoiseGateMacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.example.noisegate
